# 传奇游戏服务器配置文件
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: mir2-server
  
  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/mir2_db?useSSL=false&serverTimezone=UTC
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        
  # Redis 配置
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 5000
    pool:
      max-active: 8
      max-idle: 8
      min-idle: 0
      max-wait: -1
        
  # 日志配置
  logging:
    level:
      com.mir2: DEBUG
      root: INFO
    pattern:
      console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
      file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file:
      name: logs/mir2-server.log
      max-size: 10MB
      max-history: 30

# 游戏服务器配置
game:
  server:
    # 服务器基本信息
    name: "传奇服务器"
    version: "1.0.0"
    max-players: 1000
    port: 7000
    host: 0.0.0.0
    
    # 网络配置
    network:
      nio:
        boss-threads: 1
        worker-threads: 4
        buffer-size: 8192
        backlog: 1024
        keep-alive: true
        tcp-nodelay: true
      
    # 游戏逻辑配置
    logic:
      # 主循环执行间隔(毫秒)
      main-loop-interval: 50
      # 保存间隔(毫秒)
      save-interval: 60000
      
    # 地图配置
    map:
      # 地图数据目录
      data-dir: "data/maps"
      # 默认出生地图
      default-map: "新手村"
      # 默认出生坐标
      spawn-x: 100
      spawn-y: 100
      
    # 物品配置
    item:
      # 物品数据目录
      data-dir: "data/items"
      # 最大背包容量
      max-bag-size: 46
      # 最大掉落物品数量
      max-drop-items: 1000
      # 物品过期时间（毫秒）
      item-expire-time: 300000
      
    # 怪物配置
    monster:
      # 怪物数据目录
      data-dir: "data/monsters"
      # 怪物最大数量
      max-monsters: 5000
      # 怪物刷新间隔(毫秒)
      spawn-interval: 30000
      
    # 魔法配置
    magic:
      # 魔法数据目录
      data-dir: "data/magic"
      # 最大魔法数量
      max-count: 100
      
    # 安全配置
    security:
      # 是否开启反外挂
      anti-cheat: true
      # 速度检测阈值
      speed-threshold: 500
      # 数据包校验
      packet-validation: true
      # 最大违规次数
      max-violations: 10
      
    # 玩家配置
    player:
      # 自动回血间隔（毫秒）
      auto-heal-interval: 5000
      # 自动回血量
      auto-heal-rate: 5
      
    # 聊天配置
    chat:
      # 聊天冷却时间（毫秒）
      chat-cooldown: 1000
      # 聊天最大消息长度
      max-message-length: 100
      
    # 交易配置
    trade:
      # 交易超时时间（毫秒）
      trade-timeout: 60000
      # 交易最大物品数量
      max-trade-items: 12
      
# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true 